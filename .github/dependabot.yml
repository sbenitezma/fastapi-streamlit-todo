version: 2
updates:
  # Python deps (requirements.txt + requirements-dev.txt), one grouped PR a week.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The base image in the Dockerfile. Patch/minor only -- a major Python bump
  # (3.12 -> 3.x) is a deliberate task (wheels, requires-python, CI), not an
  # automated PR.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
