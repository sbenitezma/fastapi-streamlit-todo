# Services on the same Docker network:
#   - api       -> FastAPI on port 8000
#   - frontend  -> Streamlit dashboard on port 8501 (talks to "api")
#   - library   -> Storybook-style component library on port 8502
#                  (profile "library": not started by a plain `up`; use
#                   `.\run.ps1 library` / `.\run.ps1 library-stop`)
#
# Everything runs inside containers: nothing is installed on your machine.
# "docker compose down" removes the processes and the libraries; the data
# persists in the "todo-data" volume.

services:
  api:
    build: .
    image: proyecto2-todo
    container_name: proyecto2-api
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TODOS_DB: /app/data/todos.db
    volumes:
      - todo-data:/app/data
      - ./api:/app/api
      - ./tests:/app/tests
      # mounted so `run.ps1 test` sees the current front-end code (its unit
      # tests run in this container); unused by the API at runtime
      - ./frontend:/app/frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status == 200 else 1)"]
      # probe often only while starting; back off to 30s once healthy so we are
      # not spawning a Python interpreter every few seconds at idle
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  frontend:
    build: .
    image: proyecto2-todo
    container_name: proyecto2-frontend
    command: python -m streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/api
    volumes:
      - ./frontend:/app/frontend
      - ./.streamlit:/app/.streamlit
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  library:
    build: .
    image: proyecto2-todo
    container_name: proyecto2-library
    profiles: ["library"]        # opt-in: `docker compose --profile library up -d library`
    command: python -m streamlit run frontend/component_library.py --server.port 8502 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8502:8502"
    volumes:
      - ./frontend:/app/frontend
      - ./.streamlit:/app/.streamlit
    restart: unless-stopped

volumes:
  todo-data:
